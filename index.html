<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyanData</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 85px;
    }

    header {
      background: #102a43;
      color: white;
      padding: 25px 20px 30px;
      border-radius: 0 0 25px 25px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #102a43;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .label {
      font-size: 13px;
      opacity: .8;
      margin-bottom: 7px;
    }

    .balance {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .fund {
      background: white;
      color: #102a43;
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-weight: 700;
    }

    main {
      padding: 24px 18px;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .service {
      background: #f7f9fc;
      border: 1px solid #e5eaf0;
      border-radius: 17px;
      padding: 18px 14px;
      text-align: left;
    }

    .icon {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .service h3 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .service p {
      color: #718096;
      font-size: 12px;
      line-height: 1.4;
    }

    .transactions {
      border: 1px solid #e5eaf0;
      border-radius: 17px;
      overflow: hidden;
    }

    .empty {
      text-align: center;
      padding: 35px 20px;
      color: #718096;
      font-size: 14px;
      line-height: 1.6;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-top: 1px solid #e5eaf0;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
    }

    .nav button {
      background: none;
      border: none;
      color: #718096;
      font-size: 11px;
    }

    .nav span {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .box {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 25px 25px 0 0;
      padding: 25px 20px 35px;
    }

    .box h2 {
      margin-bottom: 8px;
    }

    .box p {
      color: #718096;
      font-size: 13px;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      border: 1px solid #dce2ea;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .primary {
      width: 100%;
      background: #102a43;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
    }

    .secondary {
      width: 100%;
      background: #edf1f5;
      color: #172033;
      border: none;
      border-radius: 12px;
      padding: 13px;
      margin-top: 10px;
    }

    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      color: #718096;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="top">
      <div class="logo">AyanData</div>
      <div class="avatar" id="avatar">A</div>
    </div>

    <div class="label">Available Balance</div>

    <div class="balance" id="balance">
      ₦0.00
    </div>

    <button class="fund" onclick="openFunding()">
      + Fund Wallet
    </button>
  </header>

  <main>

    <div class="title">Services</div>

    <div class="services">

      <button class="service" onclick="dataPage()">
        <div class="icon">📶</div>
        <h3>Buy Data</h3>
        <p>MTN, Airtel, Glo & 9mobile</p>
      </button>

      <button class="service" onclick="airtimePage()">
        <div class="icon">📱</div>
        <h3>Airtime</h3>
        <p>Recharge any network</p>
      </button>

      <button class="service" onclick="historyPage()">
        <div class="icon">💳</div>
        <h3>Transactions</h3>
        <p>View your transaction history</p>
      </button>

      <button class="service" onclick="profilePage()">
        <div class="icon">👤</div>
        <h3>Profile</h3>
        <p>Manage your account</p>
      </button>

    </div>

    <div class="title">Recent Transactions</div>

    <div class="transactions">
      <div class="empty">
        No transactions yet.<br>
        Your transactions will appear here.
      </div>
    </div>

  </main>

  <nav class="nav">

    <button onclick="homePage()">
      <span>⌂</span>
      Home
    </button>

    <button onclick="dataPage()">
      <span>📶</span>
      Data
    </button>

    <button onclick="airtimePage()">
      <span>📱</span>
      Airtime
    </button>

    <button onclick="historyPage()">
      <span>💳</span>
      History
    </button>

    <button onclick="profilePage()">
      <span>👤</span>
      Profile
    </button>

  </nav>

</div>


<!-- FUND WALLET -->

<div class="modal" id="fundModal">

  <div class="box">

    <h2>Fund Wallet</h2>

    <p>
      Add money to your AyanData wallet securely with Paystack.
    </p>

    <input
      id="amount"
      type="number"
      min="100"
      placeholder="Amount in ₦"
    >

    <button class="primary" onclick="startPayment()">
      Continue to Paystack
    </button>

    <div class="status" id="paymentStatus"></div>

    <button class="secondary" onclick="closeFunding()">
      Cancel
    </button>

  </div>

</div>


<script>

  /* =========================================
     SUPABASE
     ========================================= */

  const SUPABASE_URL = "https://thivhdxiunszfllxbags.supabase.co";

  const SUPABASE_ANON_KEY = "sb_publishable_1o4FBBUkTgfWhRdVA2H5_Q_BBYWpR6w";


  let supabaseClient = null;


  if (
    SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
    SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"
  ) {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  }


  /* =========================================
     FUNDING MODAL
     ========================================= */

  function openFunding() {

    document
      .getElementById("fundModal")
      .classList.add("show");

  }


  function closeFunding() {

    document
      .getElementById("fundModal")
      .classList.remove("show");

    document
      .getElementById("paymentStatus")
      .textContent = "";

  }


  /* =========================================
     PAYSTACK INITIALIZATION
     ========================================= */

  async function startPayment() {

    const amount =
      Number(
        document.getElementById("amount").value
      );

    const status =
      document.getElementById("paymentStatus");


    if (!amount || amount < 100) {

      status.textContent =
        "Please enter at least ₦100.";

      return;

    }


    if (!supabaseClient) {

      status.textContent =
        "Supabase is not configured.";

      return;

    }


    status.textContent =
      "Checking your account...";


    try {

      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError || !user) {

        status.textContent =
          "Please log in to AyanData before funding your wallet.";

        return;

      }


      status.textContent =
        "Connecting to Paystack...";


      const {
        data,
        error
      } =
        await supabaseClient.functions.invoke(
          "paystack-initialize",
          {
            body: {
              amount: amount
            }
          }
        );


      if (error) {

        console.error(
          "Paystack Edge Function Error:",
          error
        );

        status.textContent =
          "Payment connection failed.";

        return;

      }


      if (
        data &&
        data.authorization_url
      ) {

        status.textContent =
          "Opening secure Paystack payment...";


        setTimeout(function () {

          window.location.href =
            data.authorization_url;

        }, 500);


        return;

      }


      console.error(
        "Paystack response:",
        data
      );


      status.textContent =
        "Paystack did not return a payment link.";

    }

    catch (error) {

      console.error(
        "Payment error:",
        error
      );

      status.textContent =
        "Something went wrong connecting to Paystack.";

    }

  }


  /* =========================================
     LOAD ACCOUNT
     ========================================= */

  async function loadAccount() {

    if (!supabaseClient) {
      return;
    }


    try {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();


      if (!user) {
        return;
      }


      const name =
        user.user_metadata?.full_name ||
        user.email?.split("@")[0] ||
        "AyanData";


      document
        .getElementById("avatar")
        .textContent =
          name.charAt(0).toUpperCase();


      await loadWallet(user.id);

    }

    catch (error) {

      console.error(
        "Account error:",
        error
      );

    }

  }


  /* =========================================
     LOAD WALLET
     ========================================= */

  async function loadWallet(userId) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("wallets")
        .select("balance")
        .eq("user_id", userId)
        .maybeSingle();


    if (error) {

      console.error(
        "Wallet error:",
        error
      );

      return;

    }


    if (data) {

      const balance =
        Number(data.balance || 0);


      document
        .getElementById("balance")
        .textContent =
          "₦" +
          balance.toLocaleString(
            "en-NG",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );

    }

  }


  /* =========================================
     OTHER SERVICES
     ========================================= */

  function dataPage() {

    alert(
      "AyanData Data\n\nLive Ogdams data plans will be connected here."
    );

  }


  function airtimePage() {

    alert(
      "AyanData Airtime\n\nAirtime vending will be connected here."
    );

  }


  function historyPage() {

    alert(
      "AyanData Transactions\n\nYour transaction history will appear here."
    );

  }


  function profilePage() {

    alert(
      "AyanData Profile\n\nYour account settings will appear here."
    );

  }


  function homePage() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================================
     START
     ========================================= */

  loadAccount();

</script>

</body>
</html>
