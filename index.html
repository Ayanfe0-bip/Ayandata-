<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AyanData - Data & Wallet</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      margin-bottom: 16px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #075e54;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      color: #075e54;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      background: #f1f3f5;
      border-radius: 10px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      background: transparent;
      color: #667085;
    }

    .tab.active {
      background: white;
      color: #075e54;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .auth-submit {
      width: 100%;
      background: #075e54;
      color: white;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-size: 14px;
    }

    .error {
      background: #fee4e2;
      color: #b42318;
    }

    .success {
      background: #dcfae6;
      color: #067647;
    }

    /* APP */

    header {
      background: #075e54;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header span {
      font-size: 13px;
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #667085;
    }

    .wallet {
      background: linear-gradient(135deg, #075e54, #0b806f);
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .wallet small {
      opacity: 0.85;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0 18px;
    }

    .fund-btn {
      background: white;
      color: #075e54;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .service {
      background: white;
      padding: 22px 15px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      text-align: center;
    }

    .service-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .service button {
      margin-top: 12px;
      width: 100%;
      background: #075e54;
      color: white;
    }

    .account {
      margin-top: 20px;
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .account p {
      margin-bottom: 12px;
      word-break: break-word;
    }

    .logout {
      background: #e53935;
      color: white;
      width: 100%;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      padding: 25px;
    }

    .modal-box h3 {
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #667085;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .cancel {
      background: #eaecf0;
      color: #344054;
    }

    .pay {
      background: #075e54;
      color: white;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

===================================================== -->

<div

<script>

/* =====================================================
   AYANDATA CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://thivhdxiunszfllxbags.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_1o4FBBUkTgfWhRdVA2H5_Q_BBYWpR6w";


/* =====================================================
   SUPABASE
===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const loginTab =
  document.getElementById("loginTab");

const signupTab =
  document.getElementById("signupTab");

const authMessage =
  document.getElementById("authMessage");

const fundModal =
  document.getElementById("fundModal");

const fundMessage =
  document.getElementById("fundMessage");


/* =====================================================
   MESSAGE FUNCTIONS
===================================================== */

function showMessage(
  element,
  message,
  type
) {

  element.textContent = message;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


function hideMessage(element) {

  element.style.display =
    "none";

}


/* =====================================================
   AUTH TABS
===================================================== */

function showLogin() {

  loginForm.classList.remove(
    "hidden"
  );

  signupForm.classList.add(
    "hidden"
  );

  loginTab.classList.add(
    "active"
  );

  signupTab.classList.remove(
    "active"
  );

  hideMessage(
    authMessage
  );

}


function showSignup() {

  loginForm.classList.add(
    "hidden"
  );

  signupForm.classList.remove(
    "hidden"
  );

  loginTab.classList.remove(
    "active"
  );

  signupTab.classList.add(
    "active"
  );

  hideMessage(
    authMessage
  );

}


loginTab.addEventListener(
  "click",
  showLogin
);


signupTab.addEventListener(
  "click",
  showSignup
);


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const button =
      document.getElementById(
        "loginButton"
      );

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    button.disabled = true;

    button.textContent =
      "Logging in...";

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {
        throw error;
      }

      await loadAccount();

      loginForm.reset();

    } catch(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      showMessage(
        authMessage,
        error.message ||
          "Login failed.",
        "error"
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "Login";

    }

  }
);


/* =====================================================
   SIGN UP
===================================================== */

signupForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const name =
      document
        .getElementById("signupName")
        .value
        .trim();

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("signupPassword")
        .value;

    const confirmPassword =
      document
        .getElementById(
          "signupConfirmPassword"
        )
        .value;

    const button =
      document.getElementById(
        "signupButton"
      );


    if (
      password !==
      confirmPassword
    ) {

      showMessage(
        authMessage,
        "Passwords do not match.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "Creating Account...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signUp({

            email,

            password,

            options: {

              data: {
                full_name: name
              }

            }

          });


      if (error) {
        throw error;
      }


      if (
        data.user &&
        !data.session
      ) {

        showMessage(
          authMessage,
          "Account created. Please check your email to confirm your account, then log in.",
          "success"
        );

      } else {

        showMessage(
          authMessage,
          "Account created successfully.",
          "success"
        );

      }


      signupForm.reset();

    } catch(error) {

      console.error(
        "SIGNUP ERROR:",
        error
      );

      showMessage(
        authMessage,
        error.message ||
          "Account creation failed.",
        "error"
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "Create Account";

    }

  }
);


/* =====================================================
   LOAD ACCOUNT
===================================================== */

async function loadAccount() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getUser();


    if (error) {
      throw error;
    }


    const user =
      data.user;


    if (!user) {

      showAuth();

      return;

    }


    authScreen.classList.add(
      "hidden"
    );

    app.classList.remove(
      "hidden"
    );


    const email =
      user.email || "User";


    const name =
      user.user_metadata
        ?.full_name ||
      email.split("@")[0];


    document
      .getElementById(
        "welcomeName"
      )
      .textContent =
      "Welcome, " +
      name +
      " 👋";


    document
      .getElementById(
        "headerUser"
      )
      .textContent =
      email;


    document
      .getElementById(
        "accountEmail"
      )
      .textContent =
      email;


    await loadWallet(
      user.id
    );


    await checkPaymentReturn();


  } catch(error) {

    console.error(
      "LOAD ACCOUNT ERROR:",
      error
    );

    showMessage(
      authMessage,
      error.message ||
        "Unable to load account.",
      "error"
    );

  }

}


/* =====================================================
   SHOW AUTH
===================================================== */

function showAuth() {

  app.classList.add(
    "hidden"
  );

  authScreen.classList.remove(
    "hidden"
  );

  showLogin();

}


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth
        .signOut();

      showAuth();

    }
  );


/* =====================================================
   WALLET
===================================================== */

async function loadWallet(
  userId
) {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("wallet")
        .select("balance")
        .eq(
          "user_id",
          userId
        )
        .maybeSingle();


    if (error) {
      throw error;
    }


    const balance =
      data?.balance ?? 0;


    document
      .getElementById(
        "walletBalance"
      )
      .textContent =
      "₦" +
      Number(balance)
        .toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

  } catch(error) {

    console.error(
      "WALLET ERROR:",
      error
    );

    document
      .getElementById(
        "walletBalance"
      )
      .textContent =
      "₦0.00";

  }

}


/* =====================================================
   FUND WALLET
===================================================== */

function openFunding() {

  fundModal.style.display = "flex";

  document.getElementById("fundAmount").value = "";

  hideMessage(fundMessage);

}


function closeFunding() {

  fundModal.style.display = "none";

}


/* =====================================================
   START PAYSTACK PAYMENT
===================================================== */

async function startPayment() {

  const amountInput =
    document.getElementById("fundAmount");

  const payButton =
    document.getElementById("payButton");

  const amount =
    Number(amountInput.value);


  /* Check amount */

  if (!amount || amount < 100) {

    showMessage(
      fundMessage,
      "Please enter at least ₦100.",
      "error"
    );

    return;

  }


  /* Check Supabase */

  if (!supabaseClient) {

    showMessage(
      fundMessage,
      "Supabase is not connected.",
      "error"
    );

    return;

  }


  try {

    payButton.disabled = true;

    payButton.textContent =
      "Starting payment...";


    /* Get logged-in user */

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !user) {

      throw new Error(
        "You must be logged in before funding your wallet."
      );

    }


    /* Call our Supabase Edge Function */

    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        "paystack-initialize",
        {
          body: {
            amount: amount,
            email: user.email
          }
        }
      );


    if (error) {

      throw error;

    }


    console.log(
      "Paystack initialize response:",
      data
    );


    if (
      !data ||
      !data.authorization_url
    ) {

      throw new Error(
        data?.message ||
        "Paystack did not return a payment link."
      );

    }


    /*
      Save the reference temporarily.
      We will use it after payment.
    */

    if (data.reference) {

      sessionStorage.setItem(
        "ayanDataPaymentReference",
        data.reference
      );

    }


    /*
      Send the customer to Paystack.
    */

    window.location.href =
      data.authorization_url;


  } catch (error) {

    console.error(
      "Payment initialization error:",
      error
    );


    showMessage(
      fundMessage,
      error.message ||
        "Unable to start payment.",
      "error"
    );


    payButton.disabled = false;

    payButton.textContent =
      "Continue to Pay";

  }

}


/* =====================================================
   FUNDING BUTTONS
===================================================== */

document
  .getElementById("fundWalletButton")
  .addEventListener(
    "click",
    openFunding
  );


document
  .getElementById("cancelFundingButton")
  .addEventListener(
    "click",
    closeFunding
  );


document
  .getElementById("payButton")
  .addEventListener(
    "click",
    startPayment
  );
/* =====================================================
   START PAYSTACK PAYMENT
===================================================== */

document
  .getElementById(
    "payButton"
  )
  .addEventListener(
    "click",
    startPayment
  );


async function startPayment() {

  const amountInput =
    document.getElementById(
      "fundAmount"
    );

  const button =
    document.getElementById(
      "payButton"
    );

  const amount =
    Number(
      amountInput.value
    );


  if (
    !amount ||
    amount < 100
  ) {

    showMessage(
      fundMessage,
      "Enter an amount of at least ₦100.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Opening Paystack...";


  try {

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth
        .getUser();


    if (
      userError ||
      !userData.user
    ) {

      throw new Error(
        "You must be logged in before funding your wallet."
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          "paystack-initialize",
          {
            body: {
              amount: amount,
              callback_url:
                window.location.origin
            }
          }
        );


    if (error) {

      throw error;

    }


    if (
      !data ||
      !data.authorization_url
    ) {

      throw new Error(
        data?.message ||
        "Unable to start Paystack payment."
      );

    }


    window.location.href =
      data.authorization_url;


  } catch(error) {

    console.error(
      "PAYMENT ERROR:",
      error
    );

    showMessage(
      fundMessage,
      error.message ||
        "Payment could not be started.",
      "error"
    );


    button.disabled =
      false;

    button.textContent =
      "Continue to Pay";

  }

}


/* =====================================================
   VERIFY PAYMENT AFTER PAYSTACK RETURNS
===================================================== */

async function checkPaymentReturn() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const reference =
    params.get(
      "reference"
    );


  if (!reference) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          "paystack-verify",
          {
            body: {
              reference
            }
          }
        );


    if (error) {
      throw error;
    }


    if (
      data &&
      data.success
    ) {

      alert(
        "Payment successful! Your wallet has been credited."
      );


      await loadWallet(
        data.user_id
      );

    } else {

      alert(
        data?.message ||
        "Payment could not be verified."
      );

    }


    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );


  } catch(error) {

    console.error(
      "VERIFY ERROR:",
      error
    );

    alert(
      "Payment verification error: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}

(async function() {

  try {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (
      data &&
      data.session
    ) {

      await loadAccount();

    } else {

      showAuth();

    }

  } catch(error) {

    console.error(
      "STARTUP ERROR:",
      error
    );

    showAuth();

  }

})();
