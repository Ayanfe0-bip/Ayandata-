<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AyanData</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
      padding-bottom: 80px;
    }

    header {
      background: #102a43;
      color: white;
      padding: 24px 20px 30px;
      border-radius: 0 0 25px 25px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
    }

    .user {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #102a43;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .balance-label {
      font-size: 13px;
      opacity: .8;
      margin-bottom: 7px;
    }

    .balance {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .fund-btn {
      background: #fff;
      color: #102a43;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
    }

    main {
      padding: 22px 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .service {
      background: #f7f9fc;
      border: 1px solid #e7ebf1;
      border-radius: 17px;
      padding: 18px 14px;
      text-align: left;
    }

    .service-icon {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .service h3 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .service p {
      color: #718096;
      font-size: 12px;
    }

    .transactions {
      border: 1px solid #e7ebf1;
      border-radius: 17px;
      overflow: hidden;
    }

    .empty {
      text-align: center;
      padding: 35px 20px;
      color: #718096;
      font-size: 14px;
    }

    .transaction {
      padding: 15px;
      border-bottom: 1px solid #edf0f4;
      display: flex;
      justify-content: space-between;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-top: 1px solid #e7ebf1;
      display: flex;
      justify-content: space-around;
      padding: 11px 5px;
      z-index: 10;
    }

    .nav-item {
      background: none;
      color: #718096;
      font-size: 11px;
      text-align: center;
    }

    .nav-item.active {
      color: #102a43;
      font-weight: 700;
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 3px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 20;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 25px 25px 0 0;
      padding: 25px 20px 35px;
    }

    .modal-box h2 {
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2ea;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .primary-btn {
      width: 100%;
      background: #102a43;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 5px;
    }

    .close-btn {
      width: 100%;
      background: #edf1f5;
      color: #172033;
      padding: 13px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      color: #718096;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="top">
      <div class="brand">AyanData</div>
      <div class="user" id="userInitial">A</div>
    </div>

    <div class="balance-label">Available Balance</div>
    <div class="balance" id="balance">₦0.00</div>

    <button class="fund-btn" onclick="openFundModal()">
      + Fund Wallet
    </button>
  </header>

  <main>

    <div class="section-title">Services</div>

    <div class="services">

      <button class="service" onclick="buyData()">
        <div class="service-icon">📶</div>
        <h3>Buy Data</h3>
        <p>MTN, Airtel, Glo & 9mobile</p>
      </button>

      <button class="service" onclick="buyAirtime()">
        <div class="service-icon">📱</div>
        <h3>Airtime</h3>
        <p>Recharge any network</p>
      </button>

      <button class="service" onclick="showTransactions()">
        <div class="service-icon">💳</div>
        <h3>Transactions</h3>
        <p>View your transaction history</p>
      </button>

      <button class="service" onclick="showProfile()">
        <div class="service-icon">👤</div>
        <h3>Profile</h3>
        <p>Manage your account</p>
      </button>

    </div>

    <div class="section-title">Recent Transactions</div>

    <div class="transactions" id="transactions">
      <div class="empty">
        No transactions yet.<br />
        Your transactions will appear here.
      </div>
    </div>

  </main>

  <nav class="bottom-nav">

    <button class="nav-item active" onclick="goHome()">
      <span class="nav-icon">⌂</span>
      Home
    </button>

    <button class="nav-item" onclick="buyData()">
      <span class="nav-icon">📶</span>
      Data
    </button>

    <button class="nav-item" onclick="buyAirtime()">
      <span class="nav-icon">📱</span>
      Airtime
    </button>

    <button class="nav-item" onclick="showTransactions()">
      <span class="nav-icon">💳</span>
      History
    </button>

    <button class="nav-item" onclick="showProfile()">
      <span class="nav-icon">👤</span>
      Profile
    </button>

  </nav>

</div>


<!-- FUND WALLET MODAL -->

<div class="modal" id="fundModal">

  <div class="modal-box">

    <h2>Fund Wallet</h2>

    <input
      class="input"
      id="fundAmount"
      type="number"
      min="100"
      placeholder="Enter amount (₦)"
    />

    <button class="primary-btn" onclick="fundWallet()">
      Continue to Payment
    </button>

    <div class="status" id="fundStatus"></div>

    <button class="close-btn" onclick="closeFundModal()">
      Cancel
    </button>

  </div>

</div>


<script>

  /*
    ============================================
    AYANDATA SUPABASE CONFIGURATION
    ============================================

    Replace the two values below with:

    1. Your Supabase Project URL
    2. Your Supabase anon/publishable key

    IMPORTANT:
    Never put your PAYSTACK_SECRET_KEY
    or OGDAMS_API_KEY here.
  */

  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  let supabaseClient = null;

  if (
    SUPABASE_URL !== "https://thivhdxiunszfllxbags.supabase.co" &&
    SUPABASE_ANON_KEY !== "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoaXZoZHhpdW5zemZsbHhiYWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTMxMjksImV4cCI6MjEwNTU4OTEyOX0.WuxkCDHgusHWgBXc2w0j8io21Di5oZD2Ig4Vs4h1Chw"
  ) {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  }


  /*
    ============================================
    LOAD USER
    ============================================
  */

  async function loadUser() {

    if (!supabaseClient) {
      console.log("Supabase is not configured yet.");
      return;
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      console.log("No user currently logged in.");
      return;
    }

    const name =
      user.user_metadata?.full_name ||
      user.email?.split("@")[0] ||
      "AyanData User";

    document.getElementById("userInitial").textContent =
      name.charAt(0).toUpperCase();

    await loadWallet(user.id);
  }


  /*
    ============================================
    LOAD WALLET
    ============================================
  */

  async function loadWallet(userId) {

    if (!supabaseClient) return;

    const {
      data,
      error
    } = await supabaseClient
      .from("wallets")
      .select("balance")
      .eq("user_id", userId)
      .maybeSingle();

    if (error) {
      console.error(error);
      return;
    }

    if (data) {

      const amount = Number(data.balance || 0);

      document.getElementById("balance").textContent =
        "₦" + amount.toLocaleString("en-NG", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

    }

  }


  /*
    ============================================
    FUND WALLET
    ============================================
  */

  function openFundModal() {

    document.getElementById("fundModal")
      .classList.add("show");

  }

  function closeFundModal() {

    document.getElementById("fundModal")
      .classList.remove("show");

    document.getElementById("fundStatus")
      .textContent = "";

  }


  async function fundWallet() {

    const amount =
      Number(document.getElementById("fundAmount").value);

    const status =
      document.getElementById("fundStatus");

    if (!amount || amount < 100) {

      status.textContent =
        "Minimum funding amount is ₦100.";

      return;
    }

    if (!supabaseClient) {

      status.textContent =
        "Supabase connection is not configured yet.";

      return;
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

      status.textContent =
        "Please log in before funding your wallet.";

      return;
    }

    status.textContent =
      "Connecting to Paystack...";

    /*
      Our Paystack Edge Function will be connected here.
    */

    try {

      const {
        data,
        error
      } = await supabaseClient.functions.invoke(
        "paystack-initialize",
        {
          body: {
            amount: amount
          }
        }
      );

      if (error) {
        console.error(error);
        status.textContent =
          "Unable to start payment.";
        return;
      }

      if (data?.authorization_url) {

        window.location.href =
          data.authorization_url;

      } else {

        status.textContent =
          "Payment could not be initialized.";

      }

    } catch (err) {

      console.error(err);

      status.textContent =
        "Something went wrong.";

    }

  }


  /*
    ============================================
    SERVICES
    ============================================
  */

  function buyData() {

    alert(
      "AyanData Data Purchase\n\n" +
      "Network selection and live Ogdams data plans will be connected next."
    );

  }


  function buyAirtime() {

    alert(
      "AyanData Airtime\n\n" +
      "Airtime vending will be connected next."
    );

  }


  function showTransactions() {

    alert(
      "Transaction History\n\n" +
      "Your wallet transactions will appear here."
    );

  }


  function showProfile() {

    alert(
      "Profile\n\n" +
      "Account settings will be added here."
    );

  }


  function goHome() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
    ============================================
    START APPLICATION
    ============================================
  */

  loadUser();

</script>

</body>
</html>
