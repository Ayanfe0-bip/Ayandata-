<script>
/* =====================================================
   AYANDATA — CLEAN FRONTEND FOUNDATION
   ===================================================== */

const SUPABASE_URL =
  "https://thivhdxiunszfllxbags.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_1o4FBBUkTgfWhRdVA2H5_Q_BBYWpR6w";


/* =====================================================
   SUPABASE
   ===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
   ===================================================== */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const loginTab =
  document.getElementById("loginTab");

const signupTab =
  document.getElementById("signupTab");

const authMessage =
  document.getElementById("authMessage");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(element, message, type) {

  element.textContent = message;

  element.className =
    "message " + type;

  element.style.display = "block";

}


function hideMessage(element) {

  element.style.display = "none";

}


/* =====================================================
   SHOW LOGIN
   ===================================================== */

function showLogin() {

  loginForm.classList.remove("hidden");

  signupForm.classList.add("hidden");

  loginTab.classList.add("active");

  signupTab.classList.remove("active");

  hideMessage(authMessage);

}


/* =====================================================
   SHOW SIGN UP
   ===================================================== */

function showSignup() {

  loginForm.classList.add("hidden");

  signupForm.classList.remove("hidden");

  loginTab.classList.remove("active");

  signupTab.classList.add("active");

  hideMessage(authMessage);

}


/* =====================================================
   LOGIN TAB
   ===================================================== */

loginTab.addEventListener("click", function () {

  showLogin();

});


/* =====================================================
   SIGN UP TAB
   ===================================================== */

signupTab.addEventListener("click", function () {

  showSignup();

});


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    const button =
      document.getElementById("loginButton");

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    button.disabled = true;

    button.textContent =
      "Logging in...";

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        throw error;

      }


      loginForm.reset();

      hideMessage(authMessage);

      await loadAccount();


    } catch (error) {

      showMessage(
        authMessage,
        error.message,
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Login";

    }

  }
);


/* =====================================================
   SIGN UP
   ===================================================== */

signupForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    const button =
      document.getElementById("signupButton");

    const name =
      document
        .getElementById("signupName")
        .value
        .trim();

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("signupPassword")
        .value;

    const confirmPassword =
      document
        .getElementById("signupConfirmPassword")
        .value;


    if (password !== confirmPassword) {

      showMessage(
        authMessage,
        "Passwords do not match.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "Creating Account...";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      if (error) {

        throw error;

      }


      signupForm.reset();


      showMessage(
        authMessage,
        "Account created. Check your email if confirmation is required.",
        "success"
      );


      setTimeout(function () {

        showLogin();

        document
          .getElementById("loginEmail")
          .value = email;

      }, 1500);


    } catch (error) {

      showMessage(
        authMessage,
        error.message,
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Create Account";

    }

  }
);


/* =====================================================
   LOAD ACCOUNT
   ===================================================== */

async function loadAccount() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();


  if (error) {

    console.error(
      "Auth error:",
      error
    );

    showAuth();

    return;

  }


  if (!user) {

    showAuth();

    return;

  }


  authScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );


  const email =
    user.email || "User";


  const name =
    user.user_metadata?.full_name ||
    email.split("@")[0];


  document
    .getElementById("welcomeName")
    .textContent =
      "Welcome, " + name + " 👋";


  document
    .getElementById("headerUser")
    .textContent =
      email;


  document
    .getElementById("accountEmail")
    .textContent =
      email;


  await loadWallet(
    user.id
  );

}


/* =====================================================
   SHOW AUTH
   ===================================================== */

function showAuth() {

  app.classList.add(
    "hidden"
  );

  authScreen.classList.remove(
    "hidden"
  );

  showLogin();

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  showAuth();

}


/* =====================================================
   WALLET
   ===================================================== */

async function loadWallet(userId) {

  console.log(
    "Wallet loading for:",
    userId
  );

  document
    .getElementById("walletBalance")
    .textContent =
      "₦0.00";

}


/* =====================================================
   FUNDING — TEMPORARILY DISABLED
   ===================================================== */

function openFunding() {

  document
    .getElementById("fundModal")
    .style.display = "flex";

}


function closeFunding() {

  document
    .getElementById("fundModal")
    .style.display = "none";

}


/* =====================================================
   SERVICES
   ===================================================== */

function showComingSoon(service) {

  alert(
    service +
    " will be connected soon."
  );

}


function showProfile() {

  alert(
    "Profile section coming soon."
  );

}


/* =====================================================
   START APPLICATION
   ===================================================== */

(async function () {

  try {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (session) {

      await loadAccount();

    } else {

      showAuth();

    }

  } catch (error) {

    console.error(
      "Application startup error:",
      error
    );

    showAuth();

  }

})();
</script>
